# 용어: 친구·동행·일행 = Traveler. 특정 장면의 희망·이유·컨디션 = ParticipantPosition.
# 조율 방식은 Decision.method, 분리 행동은 AdjustmentOption.participation에 담는다.
# 기록 규칙: 본인 진술·전해 들은 말·추측을 구분한다. 침묵을 동의로 채우지 않는다.
# 인터뷰 개념 범위: 상황별 입장과 제약, 활동, 조정안, 결정·실행 결과.
# 제품 설계 범위: 인터뷰 개념을 가상 문항과 추천 협약서의 출력 계약으로 확장한다.
# 외부 참조: 지도·이동 경로, 영업·예약 정보는 여행 상황의 배경 맥락이며 서비스에서 조회하지 않는다.
# 범위 밖: 예약·결제·정산 실행, 실시간 최적 동선, 성격·궁합 점수.
# 핵심 흐름: TravelSituation → ParticipantPosition → AdjustmentOption → Decision.
# 서비스 흐름: ScenarioSet → Scenario → 일행의 응답 → PactRecommendation.
# Job Story: 동행자별 입장과 제약을 확인하고 조정안을 비교한다. 불만 감소 효과는 미검증이다.

# 운영 정책: 등록 프로필과 실제 제출 건은 구분한다. 이름 선택은 본인 확인이 아니다.
# 프로필·제출·마감·재생성·푸시·보관 계약은 SPEC.md 4~6절을 따른다.
# 프로필은 문항 개인화에만 쓰며 추천의 입장·한계 근거는 제출 응답이다.
