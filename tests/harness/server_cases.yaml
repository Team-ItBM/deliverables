# 서버 계약 골든 케이스 (강의 5 산출물: 서버 위임의 완료 기준)
#
# 대상
#   src/travel/server/ 의 HTTP API(§0-B 경로 12개)와 render.py의 토큰 치환 함수.
#   테스트는 travel.server.app.create_app(settings, llm_client, push_sender, sleeper, clock)으로 앱을 만들고
#   FastAPI TestClient로 요청한다. 모델 호출은 재생 클라이언트, 푸시는 가짜 발송기로 대신한다(§0-E).
#   함수 단위 케이스(PRF-N02, EXP-P01, EXP-N01, EXP-N02)는 render.py 함수를 직접 부른다.
#   모델 출력 품질(AC6~AC9, AC11), retention(AC19), mobile_access(AC14)는 범위 밖이다.
#
# 근거 문서
#   docs/prompts/delegation_server.md §0(인터페이스 기본안), §0-1(골든 케이스 86개), "결정한 것" 1~35.
#     세 부분 모두 2026-11-04에 사람이 수용했고, 결정 24~27은 2026-11-05에 반영했다.
#     결정 28~35(PR #15 리뷰, 2회차)는 2026-11-05에 반영했다. 케이스가 80개에서 86개로 늘었다.
#   docs/SPEC.md 4절 처리 정책, 5절, 6절 AC2~AC4·AC10·AC12·AC13·AC15~AC18
#   docs/ARCHITECTURE.md 2절, 5절, 6절, 8절
#   재생 입력: tests/harness/fixtures/scenario/ex1_ready.json, s2.json, s4.json, s5.json(§0-F).
#   추천 출력은 tests/harness/server/pact_outputs.py가 받은 model_input으로 만든다. 저장소 기준 커밋 f9cc461.
#
# 케이스 필드
#   id        : §0-1 표의 ID 그대로. P는 통과해야 하는 케이스, N은 실패를 정확히 내야 하는 케이스다.
#   case_id   : 아래 case_ids 10개 중 하나. tests/test_server_<case_id>.py에 그 케이스의 테스트 함수가 있다.
#   kind      : pass(ID가 P) 또는 fail(ID가 N).
#   ac        : 절 머리의 AC와 근거 칸에 나온 AC.
#   basis     : §0-1 근거 칸 원문.
#   note      : §0-1 기대 결과 칸 원문. 판정 키로 옮기지 못한 문장은 테스트 코드의 단언문과 주석으로 옮겼다.
#   checkpoints: 한 케이스 안에서 시점이나 변형마다 기대값이 다를 때 쓴다. [{at: <이름>, <판정 키>...}].
#               at 이름은 테스트 코드가 그 시점에 부르는 이름이다. 케이스 최상위 판정 키는 케이스 전체에 적용한다.
#   입력·조작 값(이름, 인원, 반복 20회, 시각 4분 59초 등)은 판정 키가 아니라서 테스트 코드에 둔다.
#
# 판정 키 (값은 §0-1 기대 결과 칸의 고정값이다. 테스트는 케이스의 판정 키를 모두 읽어야 하며, 읽지 않은 키가 남으면 실패한다)
#   http_status        : 조작 대상 요청의 HTTP 상태. 목록이면 그중 하나. 동시 요청 케이스에서는 진 요청의 상태다.
#   error_code         : 오류 응답 {"error": {"code"}}의 code, 또는 render.py 함수가 낸 RenderError.code. error_codes 안의 값.
#   concurrent_statuses: 동시에 보낸 요청들의 HTTP 상태를 정렬한 목록.
#   calls              : 방 하나에서 단계(scenarios, pact)별 재생 클라이언트 호출 수. 여러 방을 쓰는 케이스는 방마다 센다.
#   calls_added        : 조작 대상 요청 하나가 늘린 단계별 호출 수.
#   unchanged          : 조작 전후로 같아야 하는 관찰값 이름. room_status, submitted_count, included_count, results(방장 결과 목록),
#                        selected_result(참여자 결과 조회의 result_id), calls(단계별 호출 수), model_input(추천 호출 기록),
#                        submission(그 참여자 응답의 option_id·memo를 추천 model_input에서 확인), original_result(AI 원본의 방장
#                        결과 목록 항목에서 editable을 뺀 것과 results 행. 결정 33), previous_edit(이전 수정본의 results 행).
#   room_status, scenario_status, failure_reason: 방 조회 응답의 값. failure_reason은 failure_reasons 안의 값.
#   rooms_created      : 요청 뒤 rooms 표의 행 수.
#   expires_after_days : 방 생성 응답의 expires_at - created_at 일수.
#   scenario_notice_keys: 방장 토큰을 붙인 방 조회의 scenario_notice에 있어야 하는 키.
#   privacy_notice     : 세션 생성 응답 privacy_notice와 글자까지 같아야 하는 문장.
#   privacy_scan       : 공용 검사 함수(tests/harness/server/privacy.py)로 확인할 대상. 테스트 코드가 검사 범위(응답, 로그, 푸시 본문)를
#                        주석으로 밝힌다. forbidden_keys(§0-A 6의 키), profile_keys(gender·age_band·mbti 키), memo_markers(메모 표지의
#                        연속 15자, 문항 공개 문구와 겹친 부분 제외), original_conditions(추천 출력의 original_condition 값),
#                        profile_values(선택 프로필 값, 문항 문장에 이미 있는 값 제외), names(이름·별명), option_labels(선택지 문구).
#   token_display      : 문항 뷰를 받은 profile_id → 토큰 profile_id → 표시된 이름.
#   same_outside_tokens: true면 비교하는 뷰끼리 scenario_id·option_id 목록과 순서, 토큰 밖 문자열이 같다.
#   text_includes, text_excludes: 비교 대상 문장(문항 뷰 또는 공유 결과 문장) 어딘가에 있어야/없어야 하는 문자열.
#   rendered           : 이름 → 토큰 뒤 조사 쌍 은/는, 이/가, 을/를, 과/와, 으로/로 순서로 치환한 결과 5개.
#   rendered_by_submission: 같은 이름 제출을 제출 순서로 놓았을 때 각 토큰(은/는)이 치환된 결과.
#   submitted_count    : 마지막 제출 응답 또는 방 조회의 submitted_count.
#   distinct_participant_ids: 제출 응답들의 서로 다른 participant_id 수.
#   model_input_participant_count, model_input_response_count: 추천 호출 model_input의 participant_ids 수와 responses 수.
#   included_count     : 공유 결과의 included_count. 목록이면 그중 하나.
#   excluded_names_count: 공유 결과 excluded_names의 길이.
#   excluded_names_include_profiles: excluded_names에 있어야 하는 등록 이름의 profile_id.
#   duplicate_name_notice: profile_id → 세션 생성 응답의 duplicate_name_notice.
#   has_submission     : profile_id → 방 조회 profiles[].has_submission.
#   result_attempts    : 방장 결과 목록 results의 항목 수.
#   normal_results, failed_results: 방장 결과 목록에서 state가 normal, failed인 항목 수.
#   result_kind, result_label: 공유 결과의 kind, label.
#   source_result      : 수정본 source_result_id가 가리키는 판. ai_original 또는 latest_edit(직전 수정본).
#   shared_result      : 참여자 결과 조회가 보여주는 결과. latest_edit(보여줄 결과의 가장 최근 수정본), last_selected(마지막에 고른
#                        결과) 또는 initial(최초 정상 결과와 그 수정본. 재생성 결과가 아니다).
#   draft              : 참여자 결과 조회(GET /result)의 draft 값(결정 28·31).
#   new_result_rows    : 조작 뒤 늘어난 results 표 행 수.
#   repair_error_codes : 두 번째 추천 호출의 repair_errors에 있어야 하는 code.
#   waits              : 가짜 대기 함수가 기록한 초 목록과 정확히 같다.
#   backoff_waits      : 가짜 대기 함수 기록의 기준값. 각 기록은 기준값 이상, 기준값 + settings.retry_jitter_seconds 이하다.
#   has_humor, humor_text, humor_explanation: 공유 결과의 humor 유무와 text·explanation.
#   push_sent          : 그 시점에 늘어난 발송 수. host(방장 구독), participant_each(참여자 구독마다), total(전체).
#   host_push_text     : 방장 구독 발송 본문의 text에 들어 있어야 하는 문자열.
#   push_payload_keys  : 발송 본문(JSON 객체)의 키 집합과 정확히 같아야 하는 목록(결정 25).
#   subscription_by_send_status: 가짜 발송기가 돌려준 상태 → 발송 뒤 push_subscriptions 행(removed 또는 kept).
#   notification_records_per_pair: notifications 표에서 (event, subscription_id) 쌍마다 있어야 하는 행 수.
#
# 로더 규칙 (tests/test_server_harness.py)
#   위 필드와 판정 키 밖의 키는 거부한다. id 형식은 <3글자>-<P|N><두 자리>이고 중복을 허용하지 않는다.
#   pass 케이스에는 error_code를 두지 않는다. fail 케이스에는 기대 오류(error_code 또는 400 이상의 http_status),
#   기대 상태(room_status, scenario_status, failure_reason) 또는 금지 검사(privacy_scan, push_sent,
#   notification_records_per_pair, push_payload_keys)가 있어야 한다.
#
# 오류 코드 (§0-D 13개. 이 밖의 코드를 케이스에 쓰면 로더 오류)
#   invalid_input 422, needs_information 422, host_forbidden 403, not_found 404, room_closed 409, no_submissions 409,
#   invalid_state 409, regeneration_limit 409, session_used 409, idempotency_conflict 409, edit_not_allowed 422,
#   memo_quote 422, render_failed 500
#
# 케이스 ID (사람이 정한 범위 10개)
#   scenario_input(AC2), profile_rendering(AC15), response_privacy(AC3), response_closure(AC4), duplicate_name(AC16),
#   host_edit(AC12), regeneration(AC17), output_validation(AC10), result_export(AC13), push_events(AC18)

error_codes: [invalid_input, needs_information, host_forbidden, not_found, room_closed, no_submissions, invalid_state, regeneration_limit, session_used, idempotency_conflict, edit_not_allowed, memo_quote, render_failed]

failure_reasons: [output_invalid, call_error, interrupted]

case_ids: [scenario_input, profile_rendering, response_privacy, response_closure, duplicate_name, host_edit, regeneration, output_validation, result_export, push_events]

cases:
  # scenario_input (AC2)
  - id: INP-P01
    case_id: scenario_input
    kind: pass
    ac: ["AC2"]
    basis: "SPEC 5절 방 생성, F1"
    http_status: 201
    expires_after_days: 30
    calls: {"scenarios": 1}
    scenario_status: "ready"
    note: "201, `expires_at = created_at + 30일`. 문항 호출 1회, 모델 입력의 `participant_profiles`가 요청과 같다. 완료 뒤 `scenario_status: ready`"
  - id: INP-P02
    case_id: scenario_input
    kind: pass
    ac: ["AC2"]
    basis: "AC2 \"선택 정보 생략\", 처리 정책 \"프로필·개인화\""
    http_status: 201
    note: "201. 모델 입력 프로필에 `gender`·`age_band`·`mbti` 키가 없다(null로 채우지 않는다)"
  - id: INP-P03
    case_id: scenario_input
    kind: pass
    ac: ["AC2"]
    basis: "ARCHITECTURE 5절 입력 한도 경계"
    http_status: 201
    note: "둘 다 201"
  - id: INP-P04
    case_id: scenario_input
    kind: pass
    ac: ["AC2"]
    basis: "SPEC 상태별 처리 `ScenarioSet` 행, 문항 프롬프트 \"필드와 함수 인자\"의 `route_scenario_result`"
    checkpoints:
      - {"at": "s2", "scenario_status": "needs_information", "scenario_notice_keys": ["message", "clarification_questions"]}
      - {"at": "s5", "scenario_status": "unsupported", "scenario_notice_keys": ["message"]}
      - {"at": "s4", "scenario_status": "invalid_input", "scenario_notice_keys": ["message"]}
    note: "`scenario_status`가 출력 상태와 같다. 방장 조회의 `scenario_notice`에 `message`가 있고, `needs_information`이면 `clarification_questions`도 있다. 방장 토큰이 없는 조회에는 `scenario_notice`가 없다"
  - id: INP-N01
    case_id: scenario_input
    kind: fail
    ac: ["AC2"]
    basis: "ARCHITECTURE 5절 입력 한도"
    http_status: 422
    error_code: "invalid_input"
    rooms_created: 0
    calls: {"scenarios": 0}
    note: "422 `invalid_input`. 방을 만들지 않고 문항 호출 0회"
  - id: INP-N02
    case_id: scenario_input
    kind: fail
    ac: ["AC2"]
    basis: "AC2 \"수 불일치\", SPEC 5절 \"프로필 수는 설정 인원과 같다\""
    http_status: 422
    error_code: "invalid_input"
    calls: {"scenarios": 0}
    note: "422 `invalid_input`, 문항 호출 0회"
  - id: INP-N03
    case_id: scenario_input
    kind: fail
    ac: ["AC2"]
    basis: "AC2 \"중복 ID\""
    http_status: 422
    error_code: "invalid_input"
    calls: {"scenarios": 0}
    note: "422 `invalid_input`, 문항 호출 0회"
  - id: INP-N04
    case_id: scenario_input
    kind: fail
    ac: ["AC2"]
    basis: "AC2 \"프로필 누락\", F1(이름·별명 필수), 문항 프롬프트 A절, 결정 2"
    http_status: 422
    error_code: "needs_information"
    calls: {"scenarios": 0}
    note: "422 `needs_information`, 문항 호출 0회"
  - id: INP-N05
    case_id: scenario_input
    kind: fail
    ac: ["AC2"]
    basis: "AC2, 문항 프롬프트 D절 S2, 결정 2"
    http_status: 422
    error_code: "needs_information"
    calls: {"scenarios": 0}
    note: "422 `needs_information`, 문항 호출 0회"
  - id: INP-N06
    case_id: scenario_input
    kind: fail
    ac: ["AC2"]
    basis: "AC2, 문항 프롬프트 A절(\"기간·목적지가 모호하면\"), D절 S3, 결정 2"
    http_status: 422
    error_code: "needs_information"
    calls: {"scenarios": 0}
    note: "422 `needs_information`, 문항 호출 0회"
  - id: INP-N07
    case_id: scenario_input
    kind: fail
    ac: ["AC2"]
    basis: "SPEC 상태별 처리(\"`scenarios=null`\"), F3"
    http_status: 409
    error_code: "invalid_state"
    note: "409 `invalid_state`"

  # profile_rendering (AC15)
  - id: PRF-P01
    case_id: profile_rendering
    kind: pass
    ac: ["AC15"]
    basis: "AC15, F2, SPEC 5절 필드 연결"
    token_display: {"p1": {"p1": "당신", "p2": "지수"}, "p2": {"p1": "민준", "p2": "당신"}}
    same_outside_tokens: true
    note: "`p1` 뷰는 `{{profile:p1}}`을 `당신`, `{{profile:p2}}`를 `지수`로, `p2` 뷰는 반대로 바꾼다. 두 뷰의 `scenario_id`, `option_id` 목록·순서, 토큰 밖 문자열이 같다"
  - id: PRF-P02
    case_id: profile_rendering
    kind: pass
    ac: ["AC15"]
    basis: "AC15 판정 방법"
    text_includes: ["민준이", "민준은", "민준과", "지수가", "지수는", "지수와", "당신이", "당신은", "당신과"]
    text_excludes: ["당신가", "당신는", "당신와"]
    note: "`민준이/민준은/민준과`, `지수가/지수는/지수와`, `당신이/당신은/당신과`. 어느 뷰에도 `당신가`·`당신는`·`당신와`가 없다"
  - id: PRF-P03
    case_id: profile_rendering
    kind: pass
    ac: ["AC15"]
    basis: "AC15 \"이름 변경에 따른 뷰 비교\""
    same_outside_tokens: true
    note: "같은 프로필 위치의 뷰끼리 이름 치환 부분만 다르고 나머지 구조·문자열이 같다"
  - id: PRF-P04
    case_id: profile_rendering
    kind: pass
    ac: ["AC15"]
    basis: "SPEC 5절 \"이름에 포함된 토큰을 다시 해석하지 않는다\"(참여자 토큰 문장을 프로필 토큰에도 적용. 결정 3)"
    text_includes: ["{{profile:p2}}"]
    note: "그 이름은 글자 그대로 표시되고 다시 치환되지 않는다"
  - id: PRF-N01
    case_id: profile_rendering
    kind: fail
    ac: ["AC15", "AC3"]
    basis: "AC15, AC3, 규칙 3"
    privacy_scan: ["profile_keys", "profile_values"]
    note: "방 조회·세션 응답 어디에도 세 키가 없다. 세 값은 문항 문장에 이미 있는 경우를 빼고 나오지 않는다"
  - id: PRF-N02
    case_id: profile_rendering
    kind: fail
    ac: ["AC15"]
    basis: "AC15 \"없는 프로필 토큰을 거부\", SPEC 5절. 모델 출력 단계는 검증기 `unknown_profile_token`이 먼저 막는다"
    error_code: "render_failed"
    note: "`render_failed`. 부분 치환 문장을 돌려주지 않는다"

  # response_privacy (AC3)
  - id: PRV-P01
    case_id: response_privacy
    kind: pass
    ac: ["AC3"]
    basis: "AC3 판정 방법 첫 문장. 결정 13"
    privacy_notice: "선택과 메모 원문은 다른 사람에게 공개되지 않아요. 다만 답변에 담긴 바람과 한계는 선택한 이름과 함께 추천 결과에 반영될 수 있어요."
    note: "`privacy_notice`가 SPEC 처리 정책 \"응답·결과 공개\"의 문장과 글자까지 같다"
  - id: PRV-N01
    case_id: response_privacy
    kind: fail
    ac: ["AC3"]
    basis: "AC3, ARCHITECTURE 2절 규칙 3 확인, §0-B 3(`room_closed`)"
    privacy_scan: ["forbidden_keys", "memo_markers", "original_conditions", "profile_values"]
    checkpoints:
